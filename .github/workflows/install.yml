name: install

on:
  push:
    branches: [ fun ]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install perlbrew and relocatable-perl
        run: |
          curl -L https://install.perlbrew.pl | bash
          source ~/perl5/perlbrew/etc/bashrc
          perlbrew install skaji-relocatable-perl-5.40.1.0
          perlbrew install-cpanm
          perlbrew install-cpm

      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: |
          source ~/perl5/perlbrew/etc/bashrc
          perlbrew use skaji-relocatable-perl-5.40.1.0
          cpanm -q -n --no-man-pages App::cpm && \
          cpm install -g PAR::Packer && \
          cpm install -g

      - name: Run help (src)
        run: |
          source ~/perl5/perlbrew/etc/bashrc
          perlbrew use skaji-relocatable-perl-5.40.1.0
          perl -I ./lib script/sitebrew help

      - name: Build PAR-packed executable
        run: |
          source ~/perl5/perlbrew/etc/bashrc
          perlbrew use skaji-relocatable-perl-5.40.1.0
          perlbrew make-pp -i ./script/sitebrew -o sitebrew

      - name: Run help (PAR-packed)
        run: |
          file ./sitebrew
          ./sitebrew help

      - name: Archive PAR-packed executable
        uses: actions/upload-artifact@v4
        with:
          name: sitebrew
          path: sitebrew
