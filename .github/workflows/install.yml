name: install

on:
  push:
    branches: [ fun ]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install relocatable-perl
        run: |
          curl -fsSL https://raw.githubusercontent.com/skaji/relocatable-perl/main/perl-install | bash -s ~/perl
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: |
          export PATH=~/perl/bin:$PATH
          cpanm -q -n --no-man-pages App::cpm && \
          cpm install -g PAR::Packer && \
          cpm install -g

      - name: Run help (src)
        run: |
          export PATH=~/perl/bin:$PATH
          perl -I ./lib script/sitebrew help

      - name: PAR::Pack
        run: |
          export PATH=~/perl/bin:$PATH
          ./pp.sh

      - name: Run help (par)
        run: |
          file ./sitebrew
          ./sitebrew help

      - name: Archive PAR-packed executable
        uses: actions/upload-artifact@v4
        with:
          name: sitebrew
          path: sitebrew
